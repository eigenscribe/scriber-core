[project]
name = "scriber-core"
version = "0.1.0"
description = "Deterministic workspace baseline and rules for scientific and visualization agents."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0.0",
    "scipy>=1.11.0",
    "matplotlib>=3.8.0",
    "seaborn>=0.13.0",
    "networkx>=3.2.0",
    "ipykernel>=7.4.0",
    "pytest>=8.0.0",
]

[tool.uv]
# Tells uv to keep a local, project-scoped virtual environment
managed = true
package = false

[tool.uv.pip]
# Forces strict tracking of explicit dependencies
universal = true
