[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "scriber-core"
version = "1.0.0"
description = "Deterministic workspace baseline, styling tokens, and visualization rules for scientific and development agents."
readme = "README.md"
license = { text = "MIT" }
license-files = ["LICENSE"]
authors = [
    { name = "Scriber Labs & Eigenscribe Inc." }
]
maintainers = [
    { name = "Scriber Labs & Eigenscribe Inc." }
]
keywords = [
    "visualization",
    "cli",
    "styling",
    "gradients",
    "design-tokens",
    "scientific-computing",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Scientific/Engineering :: Visualization",
    "Topic :: Text Processing :: Linguistic",
]
requires-python = ">=3.10"
dependencies = [
    "numpy>=2.0.0",
    "scipy>=1.11.0",
    "matplotlib>=3.8.0",
    "seaborn>=0.13.0",
    "networkx>=3.2.0",
    "click>=8.0.0",
    "ipykernel>=7.3.0",
]

[project.scripts]
eigenscribe = "cli.main:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.0.0",
    "ipykernel>=6.0.0",
    "build>=1.0.0",
    "twine>=5.0.0",
]

[project.urls]
Homepage = "https://github.com/eigenscribe/scriber-core"
Repository = "https://github.com/eigenscribe/scriber-core"
Documentation = "https://scriber-core.readthedocs.io"
"Bug Tracker" = "https://github.com/eigenscribe/scriber-core/issues"
Changelog = "https://github.com/eigenscribe/scriber-core/blob/main/CHANGELOG.md"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.uv]
managed = true
package = true

[tool.hatch.build.targets.wheel]
packages = ["src/frontend", "src/cli"]

[tool.uv.pip]
universal = true
